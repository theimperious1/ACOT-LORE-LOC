############################## WEAPON ARSENAL MENU

edict_acot_arsenal_menu_edict: "§YArsenal Development Menu§!"
edict_acot_arsenal_menu_edict_desc: "Access the Weapons and Arsenal Development Menu, where we'll be able to decide what kind of weapons should or should not be developed."
edict_acot_arsenal_menu_edict_fail: "§RMenu is already active.§!"

acot_arsenal_menu.1.name: "Expanding Our Arsenal"
acot_arsenal_menu.1.desc: "The weapon research division is pleased to report their latest findings, soon we'll be able to develop new and more powerful weapons to bolster our forces.\n\nHowever, there are some who are concerned about the increasing amount of weapon prototypes proposed by various groups, and those who advocates for the discontinuation of some older concepts that they believe to be obsolete. They'd like to know if we wish to make any adjustments to what our empires should avoid researching in the future."
acot_arsenal_menu.1.a: "Very well, let's have a review."
acot_arsenal_menu.1.a.tooltip: "Open up the Options menu to review our weapon research options in case we wish to narrow down the scope of weapons we are interested in."
acot_arsenal_menu.1.b: "Not interested."
acot_arsenal_menu.1.b.tooltip: "By default, all weapon types will be available for research. You can review them again later in the Edicts tab."

acot_arsenal_menu.2.name: "Arsenal Development Menu"
acot_arsenal_menu.2.desc.a: "There are many kinds of weapons, each capable of answering to specific threats. Some better than the others."
acot_arsenal_menu.2.desc.b: "The Arsenal Development Unit is standing by for instructions. How should our empire develops our weapons of war?"
acot_arsenal_menu.2.a: "Energy Weapons"
acot_arsenal_menu.2.b: "Kinetic Weapons"
acot_arsenal_menu.2.c: "Explosive Weapons"
acot_arsenal_menu.2.d: "Strikecraft Weapons"
acot_arsenal_menu.2.exit: "That's enough for now."

acot_arsenal_menu.200.name: "Arsenal Development Menu: Energy"
acot_arsenal_menu.200.desc: "Energy Weapons are designed primarily to melt away armor and are typically weak against energy shields, although some weapons like the disruptors are used as double penetration weapons.\n\n§GEnabled§! means it will appear in the Tech Tree. §RDisabled§! Means it won't appear. Some weapons may require other weapon techs first to be unlocked."
acot_arsenal_menu.200.laser.enabled: "Laser Cannons: §GEnabled§!"
acot_arsenal_menu.200.laser.disabled: "Laser Cannons: §RDisabled§!"
acot_arsenal_menu.200.laser.tooltip: "A basic laser, Good against armor, Poor against shields."
acot_arsenal_menu.200.autolaser.enabled: "Scorcher Beams: §GEnabled§!"
acot_arsenal_menu.200.autolaser.disabled: "Scorcher Beams: §RDisabled§!"
acot_arsenal_menu.200.autolaser.tooltip: "Design based off ancient drone's mining Lasers. Very Good against armor and hulls, Very Poor against shields, Has short range."
acot_arsenal_menu.200.plasma.enabled: "Plasma Cannons: §GEnabled§!"
acot_arsenal_menu.200.plasma.disabled: "Plasma Cannons: §RDisabled§!"
acot_arsenal_menu.200.plasma.tooltip: "Plasma Cannons fire plasma projectiles to melt enemy hull. Large variants has no minimum range penalty unlike the older variants. Very good against armor and hulls, Very poor against shields."
acot_arsenal_menu.200.disruptor.enabled: "Disruptors: §GEnabled§!"
acot_arsenal_menu.200.disruptor.disabled: "Disruptors: §RDisabled§!"
acot_arsenal_menu.200.disruptor.tooltip: "Disruptors, Ignores shields and armor. Short Range."
acot_arsenal_menu.200.disruptorlance.enabled: "Disruptor Lances: §GEnabled§!"
acot_arsenal_menu.200.disruptorlance.disabled: "Disruptor Lances: §RDisabled§!"
acot_arsenal_menu.200.disruptorlance.tooltip: "Long range artillery variants of Disruptors. Ignores shields and armor. Long range. Has minimum range."
acot_arsenal_menu.200.energycannon.enabled: "Energy Cannons: §GEnabled§!"
acot_arsenal_menu.200.energycannon.disabled: "Energy Cannons: §RDisabled§!"
acot_arsenal_menu.200.energycannon.tooltip: "Energy Cannons. Good against armor and hulls. Poor against shields, Long range."
acot_arsenal_menu.200.energytorp.enabled: "Energy Torpedoes: §GEnabled§!"
acot_arsenal_menu.200.energytorp.disabled: "Energy Torpedoes: §RDisabled§!"
acot_arsenal_menu.200.energytorp.tooltip: "Energy Torpedoes are short-ranged missile projectiles. Very good against armor and hull, Poor against Shield, Short Range. Deals More damage to bigger ship classes."
acot_arsenal_menu.200.pd.enabled: "Energy Point Defenses: §GEnabled§!"
acot_arsenal_menu.200.pd.disabled: "Energy Point Defenses: §RDisabled§!"
acot_arsenal_menu.200.pd.tooltip: "Energy Point Defenses. Designed primarily to take out enemy missile projectiles."

acot_arsenal_menu.201.name: "Arsenal Development Menu: Kinetic"
acot_arsenal_menu.201.desc: "Kinetic Weapons. When you want to fire Bullets in Space at insane speeds.\n\n§GEnabled§! means it will appear in the Tech Tree. §RDisabled§! Means it won't appear. Some weapons may require other weapon techs first to be unlocked."
acot_arsenal_menu.201.massdriver.enabled: "Mass Drivers: §GEnabled§!"
acot_arsenal_menu.201.massdriver.disabled: "Mass Drivers: §RDisabled§!"
acot_arsenal_menu.201.massdriver.tooltip: "Mass Drives fire solid slug projectiles. Good against shields. Poor against armor. Large variants has no minimum range penalty unlike the older variants."
acot_arsenal_menu.201.autocannons.enabled: "Autocannons: §GEnabled§!"
acot_arsenal_menu.201.autocannons.disabled: "Autocannons: §RDisabled§!"
acot_arsenal_menu.201.autocannons.tooltip: "Autocannons fire deadly rounds at high fire rate. Good against shields and hulls. Very Poor against armor. Short Range."
acot_arsenal_menu.201.macrocannons.enabled: "Macrocannons: §GEnabled§!"
acot_arsenal_menu.201.macrocannons.disabled: "Macrocannons: §RDisabled§!"
acot_arsenal_menu.201.macrocannons.tooltip: "Marcocannons are specialized autocannons mounted on torpedo slots. Very good against shields. Poor against armor. Short range. Deals More damage to bigger ship classes."
acot_arsenal_menu.201.artillery.enabled: "Kinetic Artilleries: §GEnabled§!"
acot_arsenal_menu.201.artillery.disabled: "Kinetic Artilleries: §RDisabled§!"
acot_arsenal_menu.201.artillery.tooltip: "Kinetic Artilleries. Very Good against shields. Poor against armor. Long range. Has minimum range. "
acot_arsenal_menu.201.flak.enabled: "Kinetic Point Defenses: §GEnabled§!"
acot_arsenal_menu.201.flak.disabled: "Kinetic Point Defenses: §RDisabled§!"
acot_arsenal_menu.201.flak.tooltip: "Kinetic Point Defenses. Designed primarily to take out enemy strikecrafts."

acot_arsenal_menu.202.name: "Arsenal Development Menu: Explosive"
acot_arsenal_menu.202.desc: "Explosive weapons that are usually fired from missile-based projectives that are vulnerable to enemy point-defenses.\n\n§GEnabled§! means it will appear in the Tech Tree. §RDisabled§! Means it won't appear. Some weapons may require other weapon techs first to be unlocked."
acot_arsenal_menu.202.missiles.enabled: "Standard Missiles: §GEnabled§!"
acot_arsenal_menu.202.missiles.disabled: "Standard Missiles: §RDisabled§!"
acot_arsenal_menu.202.missiles.tooltip: "Missiles, Penetrates shields, Basic armor and hull Damage."
acot_arsenal_menu.202.swarmers.enabled: "Swarmer Missiles: §GEnabled§!"
acot_arsenal_menu.202.swarmers.disabled: "Swarmer Missiles: §RDisabled§!"
acot_arsenal_menu.202.swarmers.tooltip: "Mutiple Missiles Penetrates shields, Basic armor and hull Damage. Good for overwhelming Point Defence Systems."
acot_arsenal_menu.202.torpedoes.enabled: "Torpedoes: §GEnabled§!"
acot_arsenal_menu.202.torpedoes.disabled: "Torpedoes: §RDisabled§!"
acot_arsenal_menu.202.torpedoes.tooltip: "Penetrates shields, Good against armor. Short range. Deals More damage to bigger ship classes."
acot_arsenal_menu.202.barrage.enabled: "MMLSs: §GEnabled§!"
acot_arsenal_menu.202.barrage.disabled: "MMLSs: §RDisabled§!"
acot_arsenal_menu.202.barrage.tooltip: "Heavy artillery firing a large missile clusters. "
acot_arsenal_menu.202.ccm.enabled: "Countermeasure Missiles: §GEnabled§!"
acot_arsenal_menu.202.ccm.disabled: "Countermeasure Missiles: §RDisabled§!"
acot_arsenal_menu.202.ccm.tooltip: "CMMs are missile-based point defenses. Has longer range than most PDs. Slower fire rate. Has minimum range."

acot_arsenal_menu.203.name: "Arsenal Development Menu: Strikecrafts"
acot_arsenal_menu.203.desc: "Strikecrafts for an air show!\n\n§GEnabled§! means it will appear in the Tech Tree. §RDisabled§! Means it won't appear. Some weapons may require other weapon techs first to be unlocked."
acot_arsenal_menu.203.interceptors.enabled: "Interceptors: §GEnabled§!"
acot_arsenal_menu.203.interceptors.disabled: "Interceptors: §RDisabled§!"
acot_arsenal_menu.203.interceptors.tooltip: "Interceptors are dedicated picket strikecrafts."
acot_arsenal_menu.203.fighters.enabled: "Fighters: §GEnabled§!"
acot_arsenal_menu.203.fighters.disabled: "Fighters: §RDisabled§!"
acot_arsenal_menu.203.fighters.tooltip: "Fighters are versatile strikecrafts that can take on various tasks."
acot_arsenal_menu.203.bombers.enabled: "Bombers: §GEnabled§!"
acot_arsenal_menu.203.bombers.disabled: "Bombers: §RDisabled§!"
acot_arsenal_menu.203.bombers.tooltip: "Bombers move close to enemy ships in a strafing run to deploy a devastation payload. Deals More damage to bigger ship classes."
acot_arsenal_menu.203.gunships.enabled: "Gunships: §GEnabled§!"
acot_arsenal_menu.203.gunships.disabled: "Gunships: §RDisabled§!"
acot_arsenal_menu.203.gunships.tooltip: "Gunships fire from afar using single spinal weapons."
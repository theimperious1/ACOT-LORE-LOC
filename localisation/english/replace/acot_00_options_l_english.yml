acot_mod_options.0.desc: "Welcome to ACOT. This popup is here to notify that ACOT has been successfully initialized. If you wish to alter any settings before beginning the game, choose the Options below (This can be accessed again later on the edict menu)\n\nCurrent Installed ACOT Submods (Submods should be sorted in the following order after the main ACOT mod)\n\nACOT Override : [Root.GetOverrideActiveStatus]\nACOT Secrets Beyond the Gates : [Root.GetSBTGActiveStatus]\nACOT Defines : [Root.GetDefinesActiveStatus]"
acot_mod_options.0.a: "Yes. Proceed to Configuration Menu."

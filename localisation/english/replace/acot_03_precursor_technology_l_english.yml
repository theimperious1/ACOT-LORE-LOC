acot_oracle_recall_name: "§EDimensional Recall§!"
acot_oracle_recall_tooltip: "§EDimensional Recall§!\n\nOrders the Oracle to begin channelling its recall ability, allowing owned military fleets from a marked system to instantly teleport to where the Oracle is.\n\nTo mark the system, use construction ships to build a special marker beacon from megastructure tab.\n\n§YThe Oracle will be nigh immobile while channeling, and will automatically stops channeling after 30 days or once fleets have been recalled.§!"
acot_oracle_recall_key: "§ERecalling§!"
acot_oracle_recall_fail_condition: "§RAn Oracle is already performing this action!§!"


acot_oracle_recall_debuff_desc: "Rerouting Power."

acot_oracle_wmd_recall: "§EDimensional Recall Marker§!"
acot_oracle_wmd_recall_DESC: "Marker used to identify the system where the fleets will be recalled from."
acot_oracle_wmd_recall_MEGASTRUCTURE_DETAILS: "Marker used to identify the system where the fleets will be recalled from."

acot_ships.26.name: "Dimensional Recall on §E[from.GetName]§!"
acot_ships.26.desc: "§§E[From.GetName]§! has activated it's Dimensional Recall power. Now we need only to confirm the origin system from which the Oracle will recall fleets from.\n\nTo do this, select a construction ship and build the marker from the Megastructures Tab. The marker will teleport all military ships to the Oracle's location once activated. We have §Y30§! days to perform this action."
acot_ships.26.a: "Let us waste no time."

acot_ships.2600.name: "Dimensional Recall Successful!"
acot_ships.2600.desc: "All military fleets from §E[event_target:recalling_orgin_system.GetName]§! has been successfully teleported to §Y[event_target:recalling_oracle.GetName]§!."
acot_ships.2600.a: "In a flash!"
